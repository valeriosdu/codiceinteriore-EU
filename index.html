<!doctype html>
<html lang="%VITE_LANG%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title fallback per pre-hydration; per ogni route, react-helmet-async
         inietta il title corretto (via <SEO /> in src/components/SEO.tsx) ed è
         quel valore che finisce nell'HTML prerenderato. -->
    <title>%VITE_DEFAULT_TITLE%</title>
    <meta name="author" content="%VITE_SITE_NAME%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font principali: Source Sans 3 (body), Playfair Display (heading),
         Cormorant Garamond (editoriale sinastria), EB Garamond (legacy). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Google tag (gtag.js) — ID per-mercato via VITE_GA4_ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA4_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA4_ID%', { send_page_view: false });
    </script>
    <!-- End Google tag -->

    <!-- Meta Pixel + Microsoft Clarity caricati dopo `load` per non rubare
         tempo al primo render. Gli stub di fbq/clarity sono installati subito
         (pattern ufficiale Meta), così eventuali chiamate fatte prima del
         caricamento finiscono in coda e vengono replay-ate da fbevents.js.
         Gli ID sono per-mercato: VITE_META_PIXEL_ID, VITE_CLARITY_ID. -->
    <script>
      // fbq stub — pattern identico a quello dell'installer Meta, ma senza
      // iniettare ancora fbevents.js.
      (function (f) {
        if (f.fbq) return;
        var n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
      })(window);

      // clarity stub — stesso pattern.
      window.clarity = window.clarity || function () {
        (window.clarity.q = window.clarity.q || []).push(arguments);
      };

      function loadDeferredAnalytics() {
        var pixelId = "%VITE_META_PIXEL_ID%";
        var clarityId = "%VITE_CLARITY_ID%";

        if (pixelId) {
          var fb = document.createElement("script");
          fb.async = true;
          fb.src = "https://connect.facebook.net/en_US/fbevents.js";
          document.head.appendChild(fb);
          window.fbq("init", pixelId);
          window.fbq("track", "PageView");
        }

        if (clarityId) {
          var cl = document.createElement("script");
          cl.async = true;
          cl.src = "https://www.clarity.ms/tag/" + clarityId;
          document.head.appendChild(cl);
        }
      }

      if (document.readyState === "complete") {
        loadDeferredAnalytics();
      } else {
        window.addEventListener("load", loadDeferredAnalytics, { once: true });
      }
    </script>

    <!-- Organization + WebSite JSON-LD: globali per tutto il sito, statici per
         essere letti anche da crawler che non eseguono JavaScript (bot AI).
         Parametrizzati per-mercato via VITE_*. I tag SEO per-route (title,
         description, canonical, og:*, twitter:*, Product/FAQ JSON-LD) sono
         iniettati da react-helmet-async via <SEO /> in src/components/SEO.tsx. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "%VITE_SITE_NAME%",
      "url": "%VITE_SITE_URL%",
      "logo": "%VITE_SITE_URL%/favicon.ico",
      "description": "%VITE_SITE_DESCRIPTION%",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "%VITE_CONTACT_EMAIL%",
        "contactType": "customer support",
        "availableLanguage": "%VITE_ORG_LANGUAGE%"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "%VITE_SITE_NAME%",
      "url": "%VITE_SITE_URL%",
      "inLanguage": "%VITE_LOCALE%"
    }
    </script>
  </head>
  <body>
    <!-- Meta Pixel noscript fallback (l'ID viene sostituito a build time;
         se vuoto il tag resta inerte). -->
    <noscript
      ><img
        height="1"
        width="1"
        style="display:none"
        src="https://www.facebook.com/tr?id=%VITE_META_PIXEL_ID%&ev=PageView&noscript=1"
    /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
